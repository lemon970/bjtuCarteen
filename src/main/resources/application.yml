server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json

spring:
  jackson:
    default-property-inclusion: non_empty

# 分析存储根目录,与 reports/ 物理隔离;reports/ 可被清理但摘要长期保留。
# 启动期 fail-fast 校验:此路径必须不在 reports/ 子树内(见 ReportSummaryStore.validateConfiguration)。
analysis:
  store:
    path: ./analysis-store
